name: Test

on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v

  e2e:
    name: E2E tests (Docker, ${{ matrix.runner }})
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install client deps
        run: pip install httpx pytest Pillow

      - name: Build image
        run: docker build -t video-thumb:test .

      - name: Start container
        run: |
          docker run -d --name vt \
            -p 8005:8005 \
            -e ALLOW_PRIVATE_URL=1 \
            --add-host=host.docker.internal:host-gateway \
            video-thumb:test

      - name: Serve fixture over HTTP
        run: |
          cd tests/fixtures
          nohup python3 -m http.server 8765 > /tmp/http.log 2>&1 &
          echo $! > /tmp/http.pid
          # 起動待ち
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:8765/sample.mp4 -o /dev/null; then
              echo "fixture HTTP up"
              break
            fi
            sleep 1
          done

      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://localhost:8005
          E2E_VIDEO_URL: http://host.docker.internal:8765/sample.mp4
        run: pytest -m e2e tests/e2e/ -v

      - name: Container logs
        if: always()
        run: docker logs vt || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f vt || true
          if [ -f /tmp/http.pid ]; then
            kill "$(cat /tmp/http.pid)" || true
          fi
